services:
  - type: web
    name: rmm-dashboard
    runtime: node
    rootDir: ./
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        value: your-super-secret-key
      - key: NODE_ENV
        value: production