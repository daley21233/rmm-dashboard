services:
  - type: web
    name: rmm-dashboard-2
    runtime: node
    buildCommand: npm install && npm install --save-dev typescript @types/react @types/node && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        value: your-super-secret-key-change-this
