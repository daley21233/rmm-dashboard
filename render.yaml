# render.yaml

services:
  - type: web
    name: rmm-dashboard-2
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        value: file:./prisma/dev.db
      - key: JWT_SECRET
        value: your-super-secret-key-change-this
